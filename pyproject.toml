[project]
name = "eventagents"
version = "0.1.0"
description = "Event-driven agent architecture for smart manufacturing (simulated event mesh)"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eventagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
